[package]
name = "grizzly-agent-eval"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
description = "ResponseEval and AgentEval over a shared scoring and report core for grizzly-agent."

[dependencies]
grizzly-agent-core = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
# Desugars the object-safe async AgentEvalCase trait (set up and check are
# both async).
async-trait = { workspace = true }

[dev-dependencies]
grizzly-agent-core = { workspace = true, features = ["test-support"] }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# AgentEval test scratch directories.
tempfile = { workspace = true }

[lints]
workspace = true
