[package]
name = "grizzly-agent-skills"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
description = "Agent Skills loading, indexing, and activation for grizzly-agent, following the open Agent Skills specification."

[dependencies]
grizzly-agent-core = { workspace = true }
grizzly-agent-prompts = { workspace = true }
yaml-rust2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
grizzly-agent-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
