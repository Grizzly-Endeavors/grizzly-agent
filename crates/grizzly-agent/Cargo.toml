[package]
name = "grizzly-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
description = "Foundational primitives for building LLM agents in Rust."

[features]
default = []
# Enables the Anthropic provider client.
anthropic = ["dep:grizzly-agent-providers", "grizzly-agent-providers/anthropic"]
# Enables the OpenAI-compatible provider client.
openai = ["dep:grizzly-agent-providers", "grizzly-agent-providers/openai"]
# Enables Agent Skills loading (grizzly-agent-skills, not yet in the workspace).
skills = []
# Enables ResponseEval and AgentEval.
eval = ["dep:grizzly-agent-eval"]
# Forwards to grizzly-agent-core's scripted-provider test support.
test-support = ["grizzly-agent-core/test-support"]

[dependencies]
grizzly-agent-core = { workspace = true }
grizzly-agent-eval = { workspace = true, optional = true }
grizzly-agent-providers = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }

[lints]
workspace = true
