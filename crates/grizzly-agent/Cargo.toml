[package]
name = "grizzly-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
description = "Foundational primitives for building LLM agents in Rust."

[features]
default = []
# Enables the Anthropic provider client (grizzly-agent-providers, not yet in
# the workspace). Declared now so the feature name is stable for consumers.
anthropic = []
# Enables the OpenAI-compatible provider client (grizzly-agent-providers, not
# yet in the workspace).
openai = []
# Enables Agent Skills loading (grizzly-agent-skills, not yet in the workspace).
skills = []
# Enables ResponseEval and AgentEval (grizzly-agent-eval, not yet in the
# workspace).
eval = []
# Forwards to grizzly-agent-core's scripted-provider test support.
test-support = ["grizzly-agent-core/test-support"]

[dependencies]
grizzly-agent-core = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
