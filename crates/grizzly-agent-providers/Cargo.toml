[package]
name = "grizzly-agent-providers"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
description = "Concrete Provider clients for grizzly-agent-core: OpenAI-compatible and Anthropic, each behind its own feature."

[features]
default = []
# The OpenAI-compatible chat-completions provider (also serves vLLM, Ollama,
# and any other OpenAI-compatible gateway).
openai = [
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:async-trait",
    "dep:tracing",
    "dep:tokio",
    "dep:futures-core",
    "dep:futures-util",
]
# The Anthropic Messages provider.
anthropic = [
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:async-trait",
    "dep:tracing",
    "dep:tokio",
    "dep:futures-core",
    "dep:futures-util",
]

[dependencies]
grizzly-agent-core = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
