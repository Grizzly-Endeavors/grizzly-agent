[workspace]
resolver = "3"
members = ["crates/grizzly-agent", "crates/grizzly-agent-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/Grizzly-Endeavors/grizzly-agent"

[workspace.dependencies]
grizzly-agent-core = { path = "crates/grizzly-agent-core", version = "0.1.0" }
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
# A library emits tracing events; it does not choose the subscriber. Pulling
# tracing-subscriber in as a normal dependency would force that choice on every
# consumer, so members list it under [dev-dependencies] only, for examples and
# tests.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.19"
async-trait = "0.1.92"

# Lint configuration
#
# These rules are intentionally strict. This project is primarily developed
# and maintained by AI coding agents, and agents will take every shortcut
# that isn't explicitly denied. Warnings get ignored; only hard errors
# change behavior. The strictness here is a substitute for the discipline
# a human developer would bring naturally.
#
# Every workspace member inherits this table unchanged via `lints.workspace =
# true`. Human contributors: the pre-commit hooks enforce everything, so
# you'll know immediately if something needs fixing.

[workspace.lints.rust]
# deny rather than forbid so FFI boundaries can use a targeted
# #[expect(unsafe_code, reason = "...")] — forbid cannot be overridden at the item level.
unsafe_code = "deny"

# Every member is consumed as a dependency, so its public surface is its
# product. Undocumented public items are a defect here in a way they are not
# in a binary.
missing_docs = "deny"
# Mechanically enforces the private-first rule: `pub` on an item that no
# external path can actually reach is a sign the visibility was cargo-culted.
unreachable_pub = "deny"

[workspace.lints.clippy]
# Pedantic baseline. Kept at warn (not deny) because new clippy versions
# add lints to this group — deny would break builds on toolchain upgrades
# with no code changes. Individual lints below override where needed.
pedantic = { level = "warn", priority = -1 }

# --- Error handling: no shortcuts, no silent failures ---
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
get_unwrap = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
# Domain errors are named for what failed, not `Error`. A type literally called
# `Error` collides with every other crate's and reads as "the" error type.
error_impl_error = "deny"

# --- Panic prevention beyond unwrap/expect ---
indexing_slicing = "deny"
string_slice = "deny"

# --- Prevent incomplete/debug code from shipping ---
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# --- Controlled exit points (only main.rs may call process::exit) ---
exit = "deny"

# --- Code complexity ---
too_many_lines = "deny"

# --- Documentation and API discipline ---
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"

# --- Assertion quality ---
missing_assert_message = "deny"

# --- Lint suppression hygiene ---
# Every #[allow] must use #[expect] instead (warns when suppression is stale)
allow_attributes = "deny"
# Every suppression must explain why
allow_attributes_without_reason = "deny"

# --- Code quality enforcement ---
format_push_string = "deny"
redundant_type_annotations = "deny"
needless_raw_strings = "deny"
tests_outside_test_module = "deny"
empty_structs_with_brackets = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
clone_on_ref_ptr = "deny"
multiple_inherent_impl = "deny"
same_name_method = "deny"
unseparated_literal_suffix = "deny"
if_then_some_else_none = "deny"
shadow_unrelated = "deny"
wildcard_enum_match_arm = "deny"

# --- Antipatterns ---
rc_buffer = "deny"
rc_mutex = "deny"

# --- Keep relaxed (stylistic) ---
module_name_repetitions = "allow"
